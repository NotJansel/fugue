name: Build (Main/Root)

on:
  push:
    branches:
      - main
      - root

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: https://code.forgejo.org/actions/checkout@v5

      # Before setup-node, so its pnpm cache has a store to point at.
      - name: Set up pnpm
        uses: "https://github.com/pnpm/action-setup@v6"

      - name: Set up Node
        uses: "https://github.com/actions/setup-node@v5"

        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Runs here as well as inside the image: a broken app build fails in seconds and says why,
      # rather than a hundred lines into a Docker layer.
      - name: Build
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: "https://github.com/docker/setup-buildx-action@v3"

      - name: Log in to Container Registry
        uses: "https://github.com/docker/login-action@v3"

        with:
          registry: git.jansel.dev
          username: ${{ github.actor }}
          password: ${{ secrets.TKN }}

      # `latest` is what a deployment follows; the commit tag is what it rolls back to.
      - name: Build and push (Docker)
        uses: "https://github.com/docker/build-push-action@v6"

        with:
          context: .
          push: true

          tags: |
            git.jansel.dev/jansel/fugue:latest
            git.jansel.dev/jansel/fugue:${{ github.sha }}
